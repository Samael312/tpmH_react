name: frontend

# Comprobaciones del frontend en cada PR que lo toque: lint, tipos, tests unitarios (Vitest) y build de produccion.
# Los E2E de Playwright (npm run test:e2e) corren en .github/workflows/e2e.yml: necesitan levantar el backend con Python.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Valores de ejemplo: el build los inlinea, no se despliega nada desde aqui.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit
      - name: Tests unitarios (Vitest)
        run: npm test
      - name: Build de produccion
        run: npm run build
