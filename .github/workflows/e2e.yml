name: e2e

# Pruebas de navegador (Playwright) sobre la aplicacion real:
#  - backend semilla con SQLite temporal (backend/tests/audit/run_server.py): nunca toca una BD real ni Neon;
#  - frontend compilado (`next build` + `next start`);
#  - 4 proyectos: Chromium de escritorio, Pixel 5, Safari de escritorio (WebKit) e iPhone 13;
#  - specs: smoke, flujos largos (pago y agenda), accesibilidad (axe) y portada 3D; Lighthouse va en su propio proyecto.
# Se ejecuta en PRs que toquen frontend o backend, y a mano desde Actions.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      E2E_PYTHON: python
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores de ejemplo para que la app arranque; el servidor semilla usa su propia SQLite temporal.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      ALGORITHM: HS256
      OPENAI_API_KEY: ci-dummy
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
      RESEND_API_KEY: ci-dummy
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy
      CLOUDINARY_API_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias del backend
        run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (smoke, flujos largos, accesibilidad, portada)
        run: npx playwright test --project=chromium --project=mobile-chrome --project=webkit --project=mobile-safari
      - name: Lighthouse (portada)
        run: npx playwright test --project=lighthouse
      - name: Informe HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
