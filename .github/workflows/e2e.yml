name: e2e

# Pruebas de navegador (Playwright) sobre la aplicacion real:
#  - backend semilla con SQLite temporal (backend/tests/audit/run_server.py): nunca toca una BD real ni Neon;
#  - frontend compilado (`next build` + `next start`);
#  - job `playwright` (bloqueante): Chromium de escritorio y Pixel 5 (specs: smoke, flujos largos, accesibilidad axe y
#    portada 3D) y Lighthouse en su propio proyecto;
#  - job `webkit` (NO bloqueante, `continue-on-error`): Safari de escritorio e iPhone 13. En Linux todas las pruebas
#    que llaman a la API agotaban el tiempo (el login no completaba) y consumian los 45 min del job; queda aparte y
#    con corte rapido hasta aclarar la causa (sospecha: WebKit resuelve `localhost` a ::1 y el backend escucha en IPv4).
# Se ejecuta en PRs que toquen frontend o backend, y a mano desde Actions.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      E2E_PYTHON: python
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores de ejemplo para que la app arranque; el servidor semilla usa su propia SQLite temporal.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      ALGORITHM: HS256
      OPENAI_API_KEY: ci-dummy
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
      RESEND_API_KEY: ci-dummy
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy
      CLOUDINARY_API_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias del backend
        run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (smoke, flujos largos, accesibilidad, portada)
        run: npx playwright test --project=chromium --project=mobile-chrome
      - name: Lighthouse (portada)
        run: npx playwright test --project=lighthouse
      - name: Informe HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      E2E_PYTHON: python
      # Escucha en IPv4 e IPv6 a la vez (Linux): WebKit puede resolver `localhost` a ::1.
      E2E_BACKEND_HOST: "::"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      ALGORITHM: HS256
      OPENAI_API_KEY: ci-dummy
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
      RESEND_API_KEY: ci-dummy
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy
      CLOUDINARY_API_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias del backend
        run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps webkit
      - name: E2E WebKit (corte rapido tras 3 fallos)
        run: npx playwright test --project=webkit --project=mobile-safari --max-failures=3
      - name: Informe HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
