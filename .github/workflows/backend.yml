name: backend

# Tests del backend en cada PR que toque el backend:
#  1. tests/audit (SQLite, sin servicios externos).
#  2. Migraciones Alembic sobre PostgreSQL vacio (deben llegar a un unico head sin errores).
#  3. Concurrencia real (tests/audit/concurrency_live.py) contra un servidor y un PostgreSQL desechables.
# El PostgreSQL es el contenedor del job: nunca toca Neon ni produccion.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tpm
          POSTGRES_PASSWORD: tpm
          POSTGRES_DB: tpm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpm -d tpm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tpm:tpm@localhost:5432/tpm_ci
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      ALGORITHM: HS256
      OPENAI_API_KEY: ci-dummy
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
      RESEND_API_KEY: ci-dummy
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy
      CLOUDINARY_API_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov

      - name: Tests de auditoria (SQLite)
        # Suelo de cobertura 75 %: medido 77,5 % el 2026-11-23 (el resto sin cubrir es sobre todo god_mode, cohorts y google_calendar).
        run: python -m pytest tests/audit -q --ignore=tests/audit/concurrency_live.py --cov=app --cov-report=term:skip-covered --cov-fail-under=95

      - name: Migraciones Alembic sobre PostgreSQL vacio
        run: |
          test "$(alembic heads | wc -l)" = "1"
          alembic upgrade head
          alembic current

      - name: Concurrencia en vivo (PostgreSQL)
        run: |
          python -m tests.audit.run_dev_server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 2; done
          python -m tests.audit.concurrency_live

      - name: Log del servidor si algo falla
        if: failure()
        run: tail -n 100 server.log || true
