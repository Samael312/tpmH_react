[build]
builder = "DOCKERFILE"

[[services]]
name = "backend"
source = "backend"

[services.build]
dockerfilePath = "backend/Dockerfile"

[services.deploy]
# SEC-01: --proxy-headers para que el rate-limit vea la IP real del cliente (X-Forwarded-For de Railway).
# Mantener UN solo worker: el limitador y el scheduler viven en memoria del proceso.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "frontend"
source = "frontend"

[services.build]
dockerfilePath = "frontend/Dockerfile"

[services.deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 30